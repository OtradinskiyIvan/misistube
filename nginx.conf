server {
    listen 80;
    server_name localhost;
    client_max_body_size 250M;

    # ── API: специфичные user-эндпоинты с префиксом /auth/ ──
    location /api/v1/auth/sync {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/auth/decode {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: auth-service ──
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: liked-videos живёт в interaction-service, а не user-service ──
    location ~ ^/api/v1/users/[^/]+/liked-videos$ {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: user-service ──
    location /api/v1/users/ {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/users {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: interaction-service ──
    location /api/v1/comments/ {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/comments {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/likes {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/likes/ {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/views/ {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: creation-service ──
    location /api/v1/videos/ {
        proxy_pass http://creation-service:8000/videos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /api/v1/videos {
        proxy_pass http://creation-service:8000/videos/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: player-search-service ──
    location ~ ^/api/v1/videos/[^/]+/details$ {
        proxy_pass http://player-search-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/v1/playback/ {
        proxy_pass http://player-search-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /api/v1/search {
        proxy_pass http://player-search-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: admin-эндпоинты interaction-service (модерация) ──
    location /api/v1/admin/ {
        proxy_pass http://interaction-service:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── API: остальное (legacy) ──
    location /api/ {
        proxy_pass http://user-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ── Redirects (backward compatibility) ──
    location /watch/ {
        return 301 $scheme://$http_host/player/watch/;
    }
    location = /player/upload {
        return 301 $scheme://$http_host/creation/upload;
    }

    # ── Frontends ──────────────────────────────────────────
    location /user/ {
        proxy_pass http://user-frontend:5173/user/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /auth/ {
        proxy_pass http://auth-frontend:5174/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /creation/ {
        proxy_pass http://creation-frontend:5173/creation/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /interaction/ {
        proxy_pass http://interaction-frontend:5175/interaction/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
    location /player/ {
        proxy_pass http://player-search-frontend:5173/player/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # ── Default ──
    location / {
        return 301 $scheme://$http_host/user/;
    }
}
