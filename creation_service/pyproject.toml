[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "misistube-creation-service"
version = "0.1.0"
description = "MisisTube video upload and storage microservice"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.0",
    "pydantic==2.13.2",
    "pydantic-settings==2.13.1",
    "SQLAlchemy==2.0.49",
    "PyJWT==2.12.1",
    "passlib==1.7.4",
    "python-dotenv==1.2.2",
    "asyncpg>=0.29.0",
    "aiobotocore>=2.12.0",
    "uvicorn[standard]>=0.30.0",
    "moviepy>=2.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
    "structlog>=24.0",
]

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
