services:
  postgres:
    image: postgres:16-alpine
    container_name: misistube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: misistube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: misistube_users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misistube"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: .
      dockerfile: authorization_service/Dockerfile
    container_name: misistube-auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - authorization_service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://misistube:${POSTGRES_PASSWORD}@postgres:5432/misistube_auth
      APP_NAME: "Authorization Service"
      APP_ENV: development
      USER_SERVICE_URL: http://user-service:8000
    volumes:
      - ./logs:/app/logs:z
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user_service/Dockerfile
    container_name: misistube-user
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - user_service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://misistube:${POSTGRES_PASSWORD}@postgres:5432/misistube_users
    volumes:
      - ./logs:/app/logs:z
    depends_on:
      postgres:
        condition: service_healthy

  interaction-service:
    build:
      context: .
      dockerfile: interaction_service/Dockerfile
    container_name: misistube-interaction
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - interaction_service/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://misistube:${POSTGRES_PASSWORD}@postgres:5432/misistube_interactions
      USER_SERVICE_URL: http://user-service:8000
    volumes:
      - ./logs:/app/logs:z
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
