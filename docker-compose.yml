services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 5 }
    # ️ Гарантирует, что тесты не начнутся, пока Redis не ответит на PING
  
  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    command: server /data --console-address ":9001"
    healthcheck: { test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"] }
    # ↕️ Поднимает S3-совместимый API и Web-консоль
  
  create-buckets:
    image: minio/mc:latest
    depends_on: { minio: { condition: service_healthy } }
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/videos;
      mc anonymous set download myminio/videos;
      exit 0;
      "
    # ↕️ Инициализирует бакет и делает его публичным для чтения (нужно для presigned URL тестов)