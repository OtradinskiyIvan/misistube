# Использовать из корня проекта: docker compose -f user_service/docker-compose.yml up
# Порты параметризованы через .env в корне проекта

services:
  postgres:
    image: postgres:16-alpine
    container_name: misistube-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: misistube
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: misistube_users
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:${POSTGRES_CONTAINER_PORT:-5432}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misistube -d misistube_users"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
