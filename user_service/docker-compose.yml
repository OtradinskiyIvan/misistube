version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: misistube-user-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: misistube
      POSTGRES_PASSWORD: misistube_secret
      POSTGRES_DB: misistube_users
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U misistube -d misistube_users"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
