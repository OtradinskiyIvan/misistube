[project]
name = "user-service"
version = "0.1.0"
description = "User Service: CRUD, profiles, auth helpers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic-settings>=2.2.0",
    "pydantic[email]>=2.7.0",
    "structlog>=24.0.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "testcontainers[postgres]>=4.0.0",
    "psycopg2-binary>=2.9.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99
lint.select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]