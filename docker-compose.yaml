version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: misistube_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: video_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d video_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: misistube_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  setup-minio:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/videos --ignore-existing 2>/dev/null;
      /usr/bin/mc anonymous set download myminio/videos 2>/dev/null;
      /usr/bin/mc ilm rule add myminio/videos --expire-days 365 2>/dev/null;
      exit 0;
      "
    restart: "no"

  backend:
    build: ./creation_service
    container_name: misistube_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@db:5432/video_db
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin123
      S3_BUCKET_NAME: videos
      LOG_DIR: /logs
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./creation_service:/app
      - ./shared:/app/shared
      - ./logs:/logs

  frontend:
    build:
      context: ./frontend/creation_service
      dockerfile: Dockerfile
    container_name: misistube_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_WATCH_USE_POLLING: "true"
    volumes:
      - ./frontend/creation_service:/app
      - /app/node_modules
      - ./frontend/shared:/shared

volumes:
  postgres_data:
  minio_data:
