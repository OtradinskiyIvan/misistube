services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: 
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
  
  minio:
    image: minio/minio:latest
    ports: ["9000:9000", "9001:9001"]
    environment: 
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck: 
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3
    
  create-buckets:
    image: minio/mc:latest
    depends_on: 
      minio: 
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb myminio/videos;
      mc anonymous set download myminio/videos;
      exit 0;
      "

# Тестовый контейнер postgress => скорее всего будет БД у Яры просто
  postgres:
    image: postgres:15-alpine
    container_name: player_search_postgres
    environment:
      POSTGRES_USER: player
      POSTGRES_PASSWORD: player_pass
      POSTGRES_DB: player_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U player -d player_db"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: