services:
  # Redis (всегда запускается)
  redis:
    image: redis:7-alpine
    container_name: misistube-redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - misistube-network
    restart: unless-stopped

  # PostgreSQL (только для профиля 'testing')
  postgres:
    image: postgres:15-alpine
    container_name: misistube-postgres-test
    profiles: ["testing"]  # Запускается только с --profile testing
    environment:
      POSTGRES_USER: player
      POSTGRES_PASSWORD: player_pass
      POSTGRES_DB: player_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U player -d player_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - misistube-network
    restart: unless-stopped

  # MinIO (только для профиля 'testing')
  minio:
    image: minio/minio:latest
    container_name: misistube-minio-test
    profiles: ["testing"]  # 🔹 Запускается только с --profile testing
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console UI
    volumes:
      - minio_test_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - misistube-network
    restart: unless-stopped

  # Init-контейнер для создания бакета MinIO (только для 'testing')
  create-buckets:
    image: minio/mc:latest
    container_name: misistube-minio-init
    profiles: ["testing"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set myminio http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing myminio/videos;
      mc anonymous set download myminio/videos;
      echo 'Bucket videos created';
      exit 0;
      "
    networks:
      - misistube-network

  # Player Search Service
  player_search_service:
    build:
      context: ..
      dockerfile: player_search_service/Dockerfile
    container_name: misistube-player-search
    
    # Для Linux: разрешаем доступ к хосту (нужно, если БД/MinIO внешние)
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
    environment:
      # Redis — всегда внутри сети
      REDIS_URL: redis://redis:6379/0
      
      # Гибкая настройка БД:
      # - В профиле 'testing': используем внутренний postgres
      # - Без профиля: берём из .env (внешняя БД)
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://player:player_pass@postgres:5432/player_db}
      
      # Гибкая настройка S3:
      # - В профиле 'testing': используем внутренний minio
      # - Без профиля: берём из .env (внешний MinIO/S3)
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_VIDEOS: ${S3_BUCKET_VIDEOS:-videos}
      S3_PRESIGNED_URL_EXPIRES: ${S3_PRESIGNED_URL_EXPIRES:-900}
      
      # App config
      APP_NAME: "Player & Searching Service"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    
    ports:
      - "8000:8000"
    
    volumes:
      # Логи сохраняются на хост-машине
      - ./logs:/app/logs
    
    depends_on:
      redis:
        condition: service_healthy
      # В профиле 'testing' ждём ещё и БД/MinIO
      postgres:
        condition: service_healthy
        required: false  # Не ошибка, если сервиса нет
      minio:
        condition: service_healthy
        required: false  # Не ошибка, если сервиса нет
    
    networks:
      - misistube-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  redis_data:
  postgres_test_data:
  minio_test_data:

networks:
  misistube-network:
    driver: bridge