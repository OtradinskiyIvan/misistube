services:
  redis:
    image: redis:7-alpine
    container_name: misistube-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_HOST_PORT:-6379}:${REDIS_CONTAINER_PORT:-6379}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - misistube-network
    restart: unless-stopped

  player_search_service:
    build:
      context: ..
      dockerfile: player_search_service/Dockerfile
    container_name: misistube-player-search
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      REDIS_URL: redis://redis:${REDIS_CONTAINER_PORT:-6379}/0
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://player:player_pass@postgres:${POSTGRES_CONTAINER_PORT:-5432}/player_db}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:${MINIO_API_CONTAINER_PORT:-9000}}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-videos}
      S3_PRESIGNED_URL_EXPIRES: ${S3_PRESIGNED_URL_EXPIRES:-900}
      APP_NAME: "Player & Searching Service"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "${PLAYER_BACK_HOST_PORT:-8001}:${PLAYER_BACK_CONTAINER_PORT:-8000}"
    volumes:
      - ../logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
        required: false
      minio:
        condition: service_healthy
        required: false
    networks:
      - misistube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${PLAYER_BACK_CONTAINER_PORT:-8000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  redis_data:

networks:
  misistube-network:
    driver: bridge
