services:
  player_search_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: misistube-player-search
    environment:
      # Все адреса — через переменные окружения
      DATABASE_URL: ${DATABASE_URL:?Database URL required}
      REDIS_URL: ${REDIS_URL:-redis://localhost:6379/0}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET_VIDEOS: ${S3_BUCKET_VIDEOS:-videos}
      APP_NAME: "Player & Searching Service"
      APP_ENV: ${APP_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "8000:8000"
    networks:
      - misistube-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  misistube-network:
    driver: bridge