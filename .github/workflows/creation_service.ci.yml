name: CREATION SERVICE CI

on:
  push:
    branches: ['feature/**', 'dev', 'main']
    paths:
      - 'creation_service/**'
      - 'shared/**'
      - '.github/workflows/creation_service.ci.yml'
  pull_request:
    branches: ['feature/**', 'dev', 'main']
    paths:
      - 'creation_service/**'
      - 'shared/**'
      - '.github/workflows/creation_service.ci.yml'

permissions:
  contents: read
  pull-requests: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./creation_service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: creation_service/pyproject.toml

      - name: Install system dependencies (ffmpeg for moviepy)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -d "../shared" ]; then
            python -m pip install -e ../shared
            echo "PYTHONPATH=$(pwd)/../shared:$PYTHONPATH" >> $GITHUB_ENV
          fi
          python -m pip install -e ".[dev]"

      - name: Ruff check (lint)
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: MyPy (type checking)
        run: mypy --config-file pyproject.toml src/ tests/ || true

      - name: Run tests with coverage
        env:
          PYTHONPATH: ../shared:${PYTHONPATH}
          JWT_SECRET: test-secret-key-for-ci
        run: pytest --cov=src --cov-report=xml --cov-report=term --cov-fail-under=20

      - name: Upload coverage report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-creation-service
          path: creation_service/coverage.xml
          retention-days: 7
