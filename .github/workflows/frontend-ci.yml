name: Frontend CI
on:
  push:
    branches: [dev, main]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']
  pull_request:
    branches: [dev]
    paths: ['frontend/**', '.github/workflows/frontend-ci.yml']

env:
  CI: true

defaults:
  run:
    working-directory: ./frontend

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: './frontend/package-lock.json' }
      - run: npm ci
      - run: npm run lint
      - run: npx prettier --check "src/**/*.{ts,tsx,css}"
      - run: npx tsc --noEmit

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: './frontend/package-lock.json' }
      - run: npm ci
      - run: npm test -- --coverage --watchAll=false
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-build, path: ./frontend/dist }

  # 🔑 Критично для §6: проверка совместимости с бэкендом
  validate-contracts:
    runs-on: ubuntu-latest
    needs: [quality, test-and-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Download OpenAPI Spec
        run: curl -f ${{ secrets.BACKEND_SWAGGER_URL }}/api/v1/openapi.json -o backend-spec.json
      - name: Generate Types & Check Compatibility
        run: |
          npx openapi-typescript-codegen --input backend-spec.json --output src/api/generated
          npm run typecheck:contracts